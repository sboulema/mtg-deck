version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
  assignees:
    - "sboulema"
  groups:
    typescript-eslint:
      patterns:
        - "@typescript-eslint*"
    jest:
      patterns:
        - "jest*"

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  assignees:
    - "sboulema"