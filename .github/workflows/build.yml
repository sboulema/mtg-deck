name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  version: '1.15.${{ github.run_number }}'
  nodeVersion: '22'

jobs:
  build:
    name: 🛠️ Build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.nodeVersion }}.x

      - name: Build plugin
        run: |
          npm install
          npm run build

      - name: Generate artifact attestation
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Publish Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mtg-deck
          path: |
            main.js
            manifest.json
            styles.css